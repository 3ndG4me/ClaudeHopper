# =============================================================================
# ClaudeHopper — Nginx front-end configuration
# Domain : example.com  (Let's Encrypt TLS)
# =============================================================================
#
# Architecture:
#   [Claude Client]
#        |  configured with base_url = https://example.com
#        |
#   [Nginx :443]  ←── TLS termination (Let's Encrypt)
#        |
#   [ClaudeHopper Python proxy :8082]  ←── python claudehopper.py --port 8082
#        |
#   [api.anthropic.com]
#
# Deploy:
#   sudo cp claudehopper.conf /etc/nginx/sites-available/claudehopper
#   sudo ln -s /etc/nginx/sites-available/claudehopper /etc/nginx/sites-enabled/claudehopper
#   sudo nginx -t && sudo systemctl reload nginx
#
# Renew cert (auto via cron/systemd, or manually):
#   sudo certbot renew --nginx
# =============================================================================

upstream claudehopper_backend {
    server 127.0.0.1:8082;
    keepalive 32;
}

# =============================================================================
# HTTPS — example.com  (managed by Certbot / Let's Encrypt)
# =============================================================================
server {
    listen      443 ssl;
    listen      [::]:443 ssl ipv6only=on;
    server_name example.com;

    # ── Let's Encrypt certificates ──────────────────────────────────────────
    ssl_certificate     /etc/letsencrypt/live/example.com/fullchain.pem;  # managed by Certbot
    ssl_certificate_key /etc/letsencrypt/live/example.com/privkey.pem;    # managed by Certbot
    include             /etc/letsencrypt/options-ssl-nginx.conf;              # managed by Certbot
    ssl_dhparam         /etc/letsencrypt/ssl-dhparams.pem;                   # managed by Certbot

    # ── Disable Nginx-level gzip ─────────────────────────────────────────────
    # ClaudeHopper already decompresses Anthropic responses. If Nginx re-compresses
    # them the client receives a corrupt stream and throws a ZlibError.
    gzip off;

    # ── ClaudeHopper REST control endpoints (no streaming, short timeout fine) ──────
    location /__claudehopper__/ {
        proxy_pass              http://claudehopper_backend;
        proxy_http_version      1.1;
        proxy_set_header        Host              $host;
        proxy_set_header        X-Real-IP         $remote_addr;
        proxy_set_header        X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header        X-Forwarded-Proto $scheme;
        proxy_set_header        Connection        "";
        # Clear Accept-Encoding so ClaudeHopper never sees a compression request
        proxy_set_header        Accept-Encoding   "";
        proxy_read_timeout      30s;
        proxy_send_timeout      30s;
        proxy_connect_timeout   5s;
    }

    # ── All Claude API traffic (SSE streaming must not be buffered) ─────────
    location / {
        proxy_pass              http://claudehopper_backend;
        proxy_http_version      1.1;
        proxy_set_header        Host              $host;
        proxy_set_header        X-Real-IP         $remote_addr;
        proxy_set_header        X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header        X-Forwarded-Proto $scheme;
        proxy_set_header        Connection        "";
        # Clear Accept-Encoding so ClaudeHopper never sees a compression request
        proxy_set_header        Accept-Encoding   "";

        # Critical for Claude SSE / streaming responses
        proxy_buffering         off;
        proxy_cache             off;

        proxy_read_timeout      300s;
        proxy_send_timeout      300s;
        proxy_connect_timeout   10s;
    }
}

# =============================================================================
# HTTP → HTTPS redirect  (managed by Certbot)
# =============================================================================
server {
    listen      80;
    listen      [::]:80;
    server_name example.com;

    if ($host = example.com) {
        return 301 https://$host$request_uri;
    } # managed by Certbot

    return 404;
}
